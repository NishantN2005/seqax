# model_name TBD
root_working_dir: '/tmp'
clone_from: ''
clone_checkpoint_index: 0
reset_optimizer: False
log_tensor_stats: False

optimizer:
  # batch_size TBD
  # learning_rate TBD
  # steps TBD
  # warmup_steps TBD
  # steps_for_lr TBD
  cosine_learning_rate_final_fraction: 0.0
  adam_b1: 0.9
  adam_b2: 0.95
  adam_eps: 1.e-8
  adam_eps_root: 0.
  weight_decay: 0.1
  adam_completed_steps_offset: 0
  dataloader_steps_offset: 0

# dataset TBD

# SPIRe MixedLoss distillation; off by default so existing configs are unchanged.
distill:
  enabled: False
  teacher_config: ''
  teacher_name: ''
  omega: 0.5

weight_init_seed: 0
einsum_seed: 0

mesh:
  d: 8
  t: 1
  s: 1
use_firestore: False
firestore_gcp_project: ''
zarr_log_flush_frequency: 100
checkpoint_interval: 1907
io:
  max_io_threads: 64
max_retries: 0
