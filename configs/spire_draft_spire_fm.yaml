# SPIRe reproduction: the SPIRe draft itself (1/4 the target's body params).
#
# PHASE B: Phase A plus target-activation substitution (feedback memory).
# Feedback memory is NOT included. That is deliberate -- Figure 5 prices feedback
# memory at 0.049 tau (3.401 full vs 3.352 without), which is barely above our
# run-to-run measurement jitter of ~0.03, while distillation (0.332) and pruned
# init (0.296) are worth an order of magnitude more and are fully specified.
#
# So this config targets a PUBLISHED number, not an interpolation:
#     spire_no_feedback_memory = 3.352 at L=512
#
#   1. PYTHONPATH=. python tools/prune_init.py \
#        --target-config spire_target_1024 --target-name spire_target_1024 \
#        --draft-config spire_draft_spire_fm --draft-name spire_draft_spire_fm
#   2. python -m train --config-name=spire_draft_spire_fm +model_name=spire_draft_spire_fm
#
# Step 1 writes the pruned weights as step 0 INTO the draft's own run directory,
# rather than to a separate dir referenced by `clone_from`. seqax's clone path
# requires the source to carry a populated log.zarr, which a never-trained
# checkpoint has no way to provide. Writing step 0 in place sidesteps that: the
# trainer loads it as its own starting state. Re-running step 1 after training has
# begun is harmless -- load_checkpoint_if_it_exists takes the highest step.
#
# Architecture from arXiv:2504.06419 / spire_appendix.ipynb:
#   body  = 2 * (2*d_model + 4*d_model*n_kv*d_head + 3*d_model*d_ff) = 16,779,264
#   total = body + 2*vocab*d_model                                   = 68,290,560
#   tokens = 20 * total                                              = 1,365,811,200
#
# Note the draft matches the target in EVERY dimension except depth, which is what
# makes pruned init a literal tensor slice rather than a projection.
defaults:
  - base
  - dataset/longcrawl
  - _self_

root_working_dir: '/home/ubuntu/runs'

# Pruned init arrives as step 0 in this run's own directory (see step 1 above),
# so no clone_from is needed. prune_init.py already writes zeroed Adam moments,
# which is what reset_optimizer would have done: the target's final
# cosine-decayed moments describe a different loss surface than a fresh warmup.

model:
  vocab: 50304
  seq_len: 1024
  layers: 2
  d_model: 512
  n_q_per_kv: 1
  n_kv: 8
  d_head: 128
  d_ff: 4096
  rope_max_timescale: 10000

  # Feedback-memory slots: n_layer + 1 = 3, matching w_il in R^(n_layer x (n_layer+1)).
  # During training these are filled with the TARGET's activations at layers
  # [first-1, first-1+n_mem) = [5, 8) -- the states target layers 6,7 would have
  # seen in the full stack, which is what pruned init tore them out of.
  # Figure 5 prices this substitution at 0.393 tau, the largest single component.
  n_mem: 3

  # Sparse attention during TRAINING as well as inference -- this is what
  # separates SPIRe's draft from MagicDec's restrict-at-decode baseline.
  #
  # window 64, not 128. Evaluation scales the window as L/8 (fidelity-ledger
  # §3.6), but training has one sequence length and therefore one window, so it
  # must be pinned to an evaluation point. Every tau the paper publishes is at
  # L=512, where L/8 = 64 -- so 64 makes train and eval windows match exactly at
  # the only point that has a reference value. The residual: at L=256 and L=1024
  # the eval window (32, 128) differs from training, and any tau shortfall there
  # is partly train/test mismatch rather than a property of the draft.
  attention_mask: streaming_llm
  sink_size: 1
  window: 64

optimizer:
  batch_size: 64                # 64 * 1024 = 65,536 tokens/step
  learning_rate: 3.0e-3
  steps: 20841                  # 1,365,811,200 / 65,536
  warmup_steps: 2084
  steps_for_lr: 20841
  cosine_learning_rate_final_fraction: 0.01
  adam_atan2_a: null
  adam_atan2_b: null

# MixedLoss(w) = w * distillation_CE + (1-w) * (-alpha), w=0.5.
# alpha is the Leviathan expected acceptance probability, E_x~q[min(1, p/q)],
# computed against the frozen target's distribution -- the same target forward
# pass the distillation term already requires, so the alpha term is nearly free
# once distillation exists. Paper: w=0.5 marginally beat w=1 (3.401 vs 3.375).
distill:
  enabled: true
  teacher_config: spire_target_1024
  teacher_name: spire_target_1024
  omega: 0.5

mesh:
  d: 1
  t: 1
  s: 1

checkpoint_interval: 4000
